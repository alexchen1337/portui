name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: portui-darwin-x64
          - target: aarch64-apple-darwin
            artifact: portui-darwin-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          cp target/${{ matrix.target }}/release/portui "dist/${{ matrix.artifact }}/portui"
          chmod +x "dist/${{ matrix.artifact }}/portui"
          cd dist && tar czvf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.tar.gz
